# =============================================================================
# fabric/parameter.yml — fabric-cicd parameter file (Path 3 only).
#
# fabric-cicd reads this file from the root of repository_directory (fabric/)
# and applies the block whose key matches --target_env. Fabric Git integration
# ignores it (it isn't an item folder), and the shipped Path 2 pipeline never
# reads it.
#
# Docs: https://microsoft.github.io/fabric-cicd/latest/how_to/parameterization/
#
# Dynamic tokens resolved at deploy time in the TARGET workspace:
#   $workspace.$id                                -> target workspace ID
#   $items.<ItemType>.<DisplayName>.$id           -> that item's ID in the target
#   $items.Lakehouse.<DisplayName>.$sqlendpointid -> the lakehouse SQL endpoint ID
#
# The find_value strings below are the scaffolding GUIDs committed in
# fabric/Contoso-Sales-Model.SemanticModel/definition/expressions.tmdl.
# =============================================================================

find_replace:
  # WorkspaceId M parameter -> the target workspace.
  - find_value: "11111111-1111-1111-1111-111111111111"
    replace_value:
      test: "$workspace.$id"
      prod: "$workspace.$id"
    item_type: "SemanticModel"
    item_name: "Contoso-Sales-Model"
    file_path: "/definition/expressions.tmdl"

  # LakehouseId M parameter -> Contoso_Sales_LH in the target workspace.
  - find_value: "33333333-3333-3333-3333-333333333333"
    replace_value:
      test: "$items.Lakehouse.Contoso_Sales_LH.$id"
      prod: "$items.Lakehouse.Contoso_Sales_LH.$id"
    item_type: "SemanticModel"
    item_name: "Contoso-Sales-Model"
    file_path: "/definition/expressions.tmdl"

  # WarehouseId M parameter -> Contoso-Sales-WH in the target workspace.
  - find_value: "55555555-5555-5555-5555-555555555555"
    replace_value:
      test: "$items.Warehouse.Contoso-Sales-WH.$id"
      prod: "$items.Warehouse.Contoso-Sales-WH.$id"
    item_type: "SemanticModel"
    item_name: "Contoso-Sales-Model"
    file_path: "/definition/expressions.tmdl"
